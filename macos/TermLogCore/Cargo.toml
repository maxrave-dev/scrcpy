[package]
name = "scrcpy-termlog-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native macOS bridge over the pinned termlog backend; no terminal renderer"

[lib]
name = "scrcpy_termlog_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
